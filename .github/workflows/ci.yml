# PR checks, in strict order: formatting and linting first, then the
# dependency security scan, then the full test suite (unit + e2e) on
# every desktop OS. A stage only starts when the previous one passed.
#
# These checks gate the merge (required status checks on main), which
# is why the release pipeline does not re-run them: a commit can only
# reach main through a PR that passed all of this.
name: TypeMate CI

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  quality:
    name: Format and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze

  security:
    name: Dependency security
    needs: quality
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  test:
    name: Tests and e2e (${{ matrix.name }})
    needs: security
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            device-flags: -d windows
            launcher: ''
          - name: Linux
            runner: ubuntu-latest
            device-flags: -d linux
            launcher: xvfb-run -a
          # macOS runs the e2e suites on flutter-tester: the native
          # embedder cannot be launched under test on current Flutter
          # (https://github.com/flutter/flutter/issues/176850, "Failed
          # to foreground app; open returned 1"). Switch to "-d macos"
          # when that issue is fixed. A separate build step below still
          # compiles the real macOS app so Xcode-level breakage is
          # caught.
          - name: macOS
            runner: macos-latest
            device-flags: -d flutter-tester
            launcher: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          # libnotify-dev: the local_notifier plugin links libnotify to post
          # dictation-failure notifications.
          # libx11-dev/libxext-dev: the X11 overlay helper is compiled from
          # source during the build (tool/fetch_whisper_runtime.dart).
          # libcurl4-openssl-dev: sentry_flutter compiles sentry-native,
          # whose transport requires curl with the AsynchDNS feature.
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libnotify-dev libx11-dev libxext-dev libcurl4-openssl-dev xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Unit and widget tests
        run: flutter test

      # The Windows and Linux desktop builds fetch the bundled speech
      # runtimes (models + whisper/sherpa binaries) via CMake; cache them
      # so e2e runs do not re-download gigabytes every time.
      - name: Cache speech runtimes
        if: runner.os != 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            models
            bin
          # The overlay source is in the key so editing it busts the cache
          # and the Linux build recompiles the overlay (belt-and-suspenders
          # with the source-newer-than-output check in the fetch script).
          key: speech-runtime-${{ runner.os }}-${{ hashFiles('tool/fetch_whisper_runtime.dart', 'linux/overlay/typemate_overlay.c') }}

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: flutter build macos --debug

      # One `flutter test` invocation per file: launching several e2e files
      # from a single invocation flakes on Windows desktop (the second
      # app launch dies with "log reader stopped unexpectedly").
      - name: End-to-end tests
        shell: bash
        run: |
          set -e
          for test_file in integration_test/*_test.dart; do
            ${{ matrix.launcher }} flutter test "$test_file" ${{ matrix.device-flags }}
          done
