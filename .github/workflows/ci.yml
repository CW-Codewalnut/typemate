name: TypeMate CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  quality:
    name: Format and analyze
    # Same-repo branches are already tested by the push trigger; only PRs
    # from forks need the pull_request run, so one commit runs CI once.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze

  # Unit, widget, and end-to-end tests on every desktop OS TypeMate targets.
  # The e2e suites run on the real desktop embedder of each OS (Windows
  # runner window, Xvfb-backed GTK window on Linux, native macOS window)
  # with the OS-native adapters faked, so they are deterministic on
  # headless CI runners.
  test:
    name: Tests and e2e (${{ matrix.name }})
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            device: windows
            launcher: ''
          - name: Linux
            runner: ubuntu-latest
            device: linux
            launcher: xvfb-run -a
          - name: macOS
            runner: macos-latest
            device: macos
            launcher: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Unit and widget tests
        run: flutter test

      # The Windows and Linux desktop builds fetch the bundled speech
      # runtimes (models + whisper/sherpa binaries) via CMake; cache them
      # so e2e runs do not re-download gigabytes every time.
      - name: Cache speech runtimes
        if: runner.os != 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            models
            bin
          key: speech-runtime-${{ runner.os }}-${{ hashFiles('tool/fetch_whisper_runtime.dart') }}

      # One `flutter test` invocation per file: launching several e2e files
      # from a single invocation flakes on Windows desktop (the second
      # app launch dies with "log reader stopped unexpectedly").
      - name: End-to-end tests
        shell: bash
        run: |
          set -e
          for test_file in integration_test/*_test.dart; do
            ${{ matrix.launcher }} flutter test "$test_file" -d ${{ matrix.device }}
          done
