name: TypeMate CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  flutter-quality:
    name: Flutter quality gates
    # Same-repo branches are already tested by the push trigger; only PRs
    # from forks need the pull_request run, so one commit runs CI once.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Integration test compile check
        run: flutter test integration_test

  linux-build:
    name: Linux build and bundle
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Tests on Linux
        run: flutter test

      - name: Cache speech runtimes
        uses: actions/cache@v4
        with:
          path: |
            models
            bin
          key: speech-runtime-linux-${{ hashFiles('tool/fetch_whisper_runtime.dart') }}

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Package bundle
        run: |
          cd build/linux/x64/release
          mv bundle TypeMate
          tar -czf TypeMate-linux-x64.tar.gz TypeMate

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeMate-linux-x64
          path: build/linux/x64/release/TypeMate-linux-x64.tar.gz
          retention-days: 14
