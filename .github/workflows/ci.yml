name: TypeMate CI

# Push-only: PR checks reuse the branch's push run (GitHub attaches
# check runs to the head commit), so a pull_request trigger would only
# duplicate work — or, skipped, render as a confusing ghost run.
on:
  push:
    branches:
      - main
      - dev

jobs:
  quality:
    name: Format and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze

  # Unit, widget, and end-to-end tests on every desktop OS TypeMate targets.
  # The e2e suites run on the real desktop embedder of each OS (Windows
  # runner window, Xvfb-backed GTK window on Linux, native macOS window)
  # with the OS-native adapters faked, so they are deterministic on
  # headless CI runners.
  test:
    name: Tests and e2e (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            device-flags: -d windows
            launcher: ''
          - name: Linux
            runner: ubuntu-latest
            device-flags: -d linux
            launcher: xvfb-run -a
          # macOS runs the e2e suites on flutter-tester: the native
          # embedder cannot be launched under test on current Flutter
          # (https://github.com/flutter/flutter/issues/176850, "Failed
          # to foreground app; open returned 1"). Switch to "-d macos"
          # when that issue is fixed. A separate build step below still
          # compiles the real macOS app so Xcode-level breakage is
          # caught.
          - name: macOS
            runner: macos-latest
            device-flags: -d flutter-tester
            launcher: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Unit and widget tests
        run: flutter test

      # The Windows and Linux desktop builds fetch the bundled speech
      # runtimes (models + whisper/sherpa binaries) via CMake; cache them
      # so e2e runs do not re-download gigabytes every time.
      - name: Cache speech runtimes
        if: runner.os != 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            models
            bin
          key: speech-runtime-${{ runner.os }}-${{ hashFiles('tool/fetch_whisper_runtime.dart') }}

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: flutter build macos --debug

      # One `flutter test` invocation per file: launching several e2e files
      # from a single invocation flakes on Windows desktop (the second
      # app launch dies with "log reader stopped unexpectedly").
      - name: End-to-end tests
        shell: bash
        run: |
          set -e
          for test_file in integration_test/*_test.dart; do
            ${{ matrix.launcher }} flutter test "$test_file" ${{ matrix.device-flags }}
          done
