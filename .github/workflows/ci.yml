# PR checks, in strict order: formatting and linting first, then the
# dependency security scan, then the full test suite (unit + e2e) on
# every desktop OS. A stage only starts when the previous one passed.
#
# These checks gate the merge (required status checks on main), which
# is why the release pipeline does not re-run them: a commit can only
# reach main through a PR that passed all of this.
name: TypeMate CI

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  quality:
    name: Format and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze

  security:
    name: Dependency security
    needs: quality
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  # Android runs the same e2e suite as the desktop matrix, on a real
  # emulator (GitHub's ubuntu runners have KVM). The release build comes
  # first: Gradle/Kotlin/plugin breakage is where every Android failure
  # so far has lived, and the e2e run only exercises debug.
  build-android:
    name: Tests and e2e (Android)
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Gradle re-resolves and re-compiles from scratch on a cold runner;
      # caching the dependency/build caches cuts both the release build and
      # the per-test debug builds substantially.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # No --no-pub on the builds: each `flutter build` re-runs pub to
      # regenerate GeneratedPluginRegistrant for its mode (release drops the
      # integration_test plugin; debug keeps it). Skipping that here makes
      # the release build compile a dev-inclusive registrant and fail on the
      # missing integration_test package. --no-pub is applied only to the
      # per-file e2e loop below, which is where the repeated pub-get lived.
      - name: Build release APK
        run: flutter build apk --release

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cache the AVD + a warm snapshot so runs boot from a saved state
      # instead of cold-booting and provisioning the system image every time.
      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot."

      # One `flutter test` invocation per file, mirroring the desktop
      # matrix (multiple e2e files from one invocation flakes there).
      - name: End-to-end tests on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The emulator-runner executes each script line as its own
          # `sh -c`, so the whole loop must be one line (a multi-line
          # for/do/done gets split and fails with "unexpected EOF").
          script: |
            flutter build apk --debug
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant com.codewalnut.typemate android.permission.RECORD_AUDIO
            for f in integration_test/*_test.dart; do flutter test "$f" -d emulator-5554 --no-pub || exit 1; done

  test:
    name: Tests and e2e (${{ matrix.name }})
    needs: security
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            device-flags: -d windows
            launcher: ''
          - name: Linux
            runner: ubuntu-latest
            device-flags: -d linux
            launcher: xvfb-run -a
          # macOS runs the e2e suites on flutter-tester: the native
          # embedder cannot be launched under test on current Flutter
          # (https://github.com/flutter/flutter/issues/176850, "Failed
          # to foreground app; open returned 1"). Switch to "-d macos"
          # when that issue is fixed. A separate build step below still
          # compiles the real macOS app so Xcode-level breakage is
          # caught.
          - name: macOS
            runner: macos-latest
            device-flags: -d flutter-tester
            launcher: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          # libnotify-dev: the local_notifier plugin links libnotify to post
          # dictation-failure notifications.
          # libx11-dev/libxext-dev: the X11 overlay helper is compiled from
          # source during the build (tool/fetch_whisper_runtime.dart).
          # libcurl4-openssl-dev: sentry_flutter compiles sentry-native,
          # whose transport requires curl with the AsynchDNS feature.
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libnotify-dev libx11-dev libxext-dev libcurl4-openssl-dev xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Unit and widget tests
        run: flutter test

      # The Windows and Linux desktop builds fetch the bundled speech
      # runtimes (models + whisper/sherpa binaries) via CMake; cache them
      # so e2e runs do not re-download gigabytes every time.
      - name: Cache speech runtimes
        if: runner.os != 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            models
            bin
          # The overlay source is in the key so editing it busts the cache
          # and the Linux build recompiles the overlay (belt-and-suspenders
          # with the source-newer-than-output check in the fetch script).
          key: speech-runtime-${{ runner.os }}-${{ hashFiles('tool/fetch_whisper_runtime.dart', 'linux/overlay/typemate_overlay.c') }}

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: flutter build macos --debug

      # One `flutter test` invocation per file: launching several e2e files
      # from a single invocation flakes on Windows desktop (the second
      # app launch dies with "log reader stopped unexpectedly").
      - name: End-to-end tests
        shell: bash
        run: |
          set -e
          for test_file in integration_test/*_test.dart; do
            ${{ matrix.launcher }} flutter test "$test_file" ${{ matrix.device-flags }}
          done
